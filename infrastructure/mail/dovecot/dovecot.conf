# Dovecot Configuration
# IMAP/POP3 Mail Delivery Agent for StreamVault

# ─────────────────────────────────────────────────────────
# Protocols
# ─────────────────────────────────────────────────────────
protocols = imap pop3
listen = *

# ─────────────────────────────────────────────────────────
# SSL/TLS (disabled for internal network)
# ─────────────────────────────────────────────────────────
ssl = no
ssl_cert =
ssl_key =

# ─────────────────────────────────────────────────────────
# Mailbox Settings
# ─────────────────────────────────────────────────────────
mail_location = maildir:/var/mail/streamvault/%u
mail_uid = 5000
mail_gid = 5000
mail_privileged_group = vmail

# Create mail directories if they don't exist
mail_plugins = maildir_plugin

# ─────────────────────────────────────────────────────────
# Authentication
# ─────────────────────────────────────────────────────────
auth_mechanisms = plain login

# Password database (file-based)
passdb {
  driver = passwd-file
  args = scheme=PLAIN username_format=%u /etc/dovecot/passwd
}

# User database
userdb {
  driver = static
  args = uid=5000 gid=5000 home=/var/mail/streamvault/%u
}

# ─────────────────────────────────────────────────────────
# Service Configuration
# ─────────────────────────────────────────────────────────
# LMTP socket for Postfix delivery
service lmtp {
  unix_listener /var/spool/postfix/private/dovecot-lmtp {
    group = postfix
    mode = 0600
    user = postfix
  }
}

# IMAP service
service imap {
  process_limit = 100
}

# ─────────────────────────────────────────────────────────
# Logging
# ─────────────────────────────────────────────────────────
log_path = /var/log/dovecot.log
info_log_path = /var/log/dovecot-info.log
log_timestamp = "%Y-%m-%d %H:%M:%S "

# ─────────────────────────────────────────────────────────
# Namespace (for mailbox organization)
# ─────────────────────────────────────────────────────────
namespace inbox {
  inbox = yes
  mailbox Sent {
    auto = subscribe
    special_use = \Sent
  }
  mailbox Drafts {
    auto = subscribe
    special_use = \Drafts
  }
  mailbox Trash {
    auto = subscribe
    special_use = \Trash
  }
}

# ─────────────────────────────────────────────────────────
# Plugins
# ─────────────────────────────────────────────────────────
mail_plugins = $mail_plugins quota

# ─────────────────────────────────────────────────────────
# Quota (optional)
# ─────────────────────────────────────────────────────────
plugin {
  quota = maildir:User quota
  quota_rule = *:storage=500M
}