# dnsmasq configuration for StreamVault
# DNS Server for internal network 192.168.1.0/24

# No DNS from upstream - we only resolve our local domain
no-resolv
no-poll

# Add domain to simple names
local=/streamvault.local/
domain=streamvault.local
expand-hosts

# Upstream DNS (for external resolution)
server=8.8.8.8
server=8.8.4.4

# Local hosts - add your internal network IPs here
# Format: IP_address hostname [hostname ...]
# 192.168.1.10 streamvault.local
# 192.168.1.20 api.streamvault.local
# 192.168.1.30 mail.streamvault.local

# Don't read /etc/resolv.conf
no-resolv

# Cache size
cache-size=1000

# Log settings
log-queries
log-dhcp

# Interface
interface=eth0

# Allow only local network queries
bind-interfaces

# Read additional hosts file
addn-hosts=/etc/hosts.dnsmasq