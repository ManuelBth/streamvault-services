# dnsmasq configuration for StreamVault
# DNS Server for internal network

# No DNS from upstream - we only resolve our local domain
no-resolv
no-poll

# Add domain to simple names
local=/streamvault.com/
domain=streamvault.com
expand-hosts

# Upstream DNS (for external resolution)
server=8.8.8.8
server=8.8.4.4

# Cache size
cache-size=1000

# Log settings
log-queries
log-dhcp

# Listen on ALL interfaces (for GNS3 multi-network)
# bind-dynamic allows binding to all available interfaces
bind-dynamic

# Read additional hosts file
addn-hosts=/etc/hosts.dnsmasq